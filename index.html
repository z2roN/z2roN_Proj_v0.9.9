<header><h1 id="ht">z2roN_Proj</h1><small id="hv"></small><small id="hs" title="접속한 서버 주소"></small><span class="sp"></span><span id="hr"></span></header>

<script>

function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){if(a[k]==null)continue;if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else if(k==='value')e.value=a[k];else e.setAttribute(k,a[k]);}

async function api(path,o={}){

function setToken(t){st.token=t;try{t?localStorage.setItem('zs_token',t):localStorage.removeItem('zs_token')}catch{}}
function modal(title,body,btns,onClose){const m=h('div',{class:'m'});const close=()=>{m.remove();if(onClose)try{onClose()}catch{}};
 const mf=h('div',{class:'mf'},(btns||[]).map(b=>h('button',{class:b.c||'',onclick:async()=>{try{if((b.f?await b.f(close):undefined)!==false&&!b.keep)close();}catch(e){toast(e.message,1)}}},b.t)));
 m.append(h('div',{class:'mb'},h('h3',null,title),h('div',{class:'mc'},body),mf));
 m.addEventListener('mousedown',e=>{if(e.target===m)close();});document.body.append(m);return close;}
function dropZone(f){const lab=h('div',{class:'dzn'},'');const upd=()=>{lab.textContent=f.files[0]?'선택됨: '+f.files[0].name:'';};f.addEventListener('change',upd);

 const z=h('div',{class:'dz'},h('div',{class:'dzt'},'⬇ 파일을 여기로 끌어다 놓거나'),h('button',{class:'b',type:'button',onclick:()=>f.click()},'📁 파일 선택'),f,lab);
 ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.add('on');}));
 ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.remove('on');}));
 z.addEventListener('drop',e=>{const fl=e.dataTransfer&&e.dataTransfer.files;if(!fl||!fl.length)return;
  if(!/\.(xlsx|xls|csv|txt)$/i.test(fl[0].name)){toast('엑셀(xlsx, xls) 또는 csv 파일만 올릴 수 있습니다.',1);return;}
  try{f.files=fl;}catch{toast('이 브라우저는 끌어놓기를 지원하지 않습니다. 아래에서 선택하세요.',1);}upd();});

window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
function field(label,el){return h('div',{class:'f'},h('label',null,label),el);}
const isAdmin=()=>st.user&&st.user.role==='admin',canEdit=()=>st.user&&st.user.role!=='viewer';

async function init(){
 st.info=await api('/api/info');document.title=st.info.name;$('#ht').textContent=st.info.name;$('#hv').textContent='v'+st.info.version;{const hn=location.hostname,priv=/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.)|^localhost$/.test(hn);$('#hs').textContent=(priv?'내부망 ':'외부 ')+location.host;}
 if(st.token&&!st.info.needSetup){try{st.user=await api('/api/me');}catch{setToken('');}}
 if(st.user)await loadSheets();render();}
async function loadSheets(){st.sheets=await api('/api/sheets');if(!Array.isArray(st.sheets))throw new Error('시트 목록 응답이 배열이 아닙니다: '+JSON.stringify(st.sheets).slice(0,150));

async function loadRows(){

 try{localStorage.setItem('zs_sid',st.sid)}catch{}
 const p=new URLSearchParams({q:st.q,sort:st.sort,desc:st.desc?1:0,offset:st.off,limit:st.lim});
 const j=await api('/api/sheets/'+st.sid+'/rows?'+p);st.cols=j.cols;st.rows=j.rows;st.total=j.total;st.keyCol=j.keyCol||'';}

function renameSheet(){
 const s=st.sheets.find(x=>x.id===st.sid);if(!s)return;const n=h('input',{value:s.name,maxlength:'60',style:'width:100%'});

  [{t:'취소'},{t:'저장',c:'b',f:async()=>{const v=n.value.trim();if(!v){toast('이름을 입력하세요.',1);return false;}
   await api('/api/sheets/'+st.sid,{method:'PUT',body:{name:v}});await loadSheets();render();toast('이름을 바꿨습니다.');}}]);}
/* 데이터 갱신(수동): 서버의 최신 시트 목록·행 수·표를 다시 읽음 */
async function refreshData(){
 try{await loadSheets();render();toast('갱신 완료 — 시트 '+st.sheets.length+'개, 현재 시트 '+st.total+'행');}catch(e){toast('갱신 실패: '+e.message,1);}
}

function render(){
 const app=$('#app');app.replaceChildren();const hr=$('#hr');hr.replaceChildren();
 if(!st.info)return;
 if(st.info.needSetup)return app.append(authCard('처음 시작: 관리자 계정 만들기 (서버 PC 에서만 가능)',true));
 if(!st.user)return app.append(authCard('로그인',false));
 hr.append(h('span',{class:'info',style:'color:#fff;margin-right:6px'},st.user.name+' ('+({admin:'관리자',user:'사용자',viewer:'조회전용'}[st.user.role])+')'),
  h('button',{class:'w',onclick:digitModal},'🔔 자리수'),' ',h('button',{class:'w',onclick:pwModal},'비밀번호'),' ',h('button',{class:'w',onclick:logout},'로그아웃'));
 if(st.cnt)return renderCnt();
 if(st.pop)return renderPop();
 if(st.pv)return renderPurchase();
 if(st.dbv&&st.sid)return renderDb();
 const sel=h('select',{onchange:async e=>{st.sid=+e.target.value;st.off=0;st.q='';st.sort='';st.look=null;await loadRows();render();}},
  st.sheets.map(s=>h('option',{value:s.id},s.name+' ('+s.rows+')')));sel.value=st.sid;
 const bar=h('div',{class:'bar menu'},sel,h('button',{class:'g wide',onclick:refreshData},'🔄 데이터 갱신'),
  canStruct()?h('button',{class:'b',onclick:newSheet},'새 시트'):null,
  canEdit()?h('button',{class:'b',onclick:importModal},'엑셀 올리기'):null,
  st.sid?h('button',{class:'g',onclick:exportXlsx},'엑셀 받기'):null,
  st.sid&&canStruct()?h('button',{class:'o',onclick:sheetSettings},'시트·열 설정'):null,
  h('button',{class:'p',onclick:()=>{st.pop=null;st.dbv=false;st.pv={list:true};render();}},'📦 매입'),
  h('button',{class:'g',onclick:()=>{st.pop=null;st.pv=null;st.dbv=false;st.cnt={};render();}},'📋 수량점검'),
  h('button',{class:'o',onclick:()=>{st.pv=null;st.dbv=false;st.pop={view:'list'};render();}},'🏷 가격POP'),
  isAdmin()?h('button',{class:'p wide',onclick:adminModal},'⚙ 관리자'):null);

 if(!st.sid)return app.append(h('div',{class:'card'},'시트가 없습니다. [새 시트] 또는 [엑셀 올리기]로 시작하세요.'));
 if(st.keyCol){
  const lk=h('input',{id:'lk',placeholder:'바코드 스캔·입력',inputmode:kbOff()?'none':'numeric',autocomplete:'off',onkeydown:e=>{if(e.key==='Enter')doLook(e.target.value);}});
  app.append(h('div',{class:'card lkc'},h('div',{class:'lkh'},h('b',null,'바코드 조회')),h('div',{class:'lkrow'},lk,h('button',{class:'g',onclick:()=>doLook(lk.value)},'조회'),h('button',{class:'o',onclick:()=>openCam()},'📷 카메라'),kbBtn()),lookCard()));

function authCard(title,setup){

let zxLoad=null;
function loadZX(){if(window.ZXing)return Promise.resolve();if(zxLoad)return zxLoad;
 zxLoad=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;
  s.onerror=()=>{zxLoad=null;rej(new Error('카메라 스캔 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'))};document.head.append(s);});return zxLoad;}
async function openCam(cb,keep){
 if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('카메라는 HTTPS 주소(또는 서버 PC 의 localhost)에서만 쓸 수 있습니다. 서버 설정에서 HTTPS 인증서를 설정하세요.',1);return;}
 const video=h('video',{playsinline:'',autoplay:'',style:'width:100%;border-radius:10px;background:#000;max-height:60vh'});video.muted=true;
 const msg=h('div',{class:'info',style:'margin-top:8px'},keep?'바코드를 비추면 1개씩 셉니다. 같은 바코드는 화면에서 치웠다가 다시 비추면 또 셉니다.':'바코드를 화면 가운데에 비춰 주세요.');
 let stop=()=>{},done=false,stream=null,timer=null,reader=null;
 stop=()=>{done=true;if(timer)clearInterval(timer);if(reader){try{reader.reset()}catch{}}if(stream)stream.getTracks().forEach(t=>t.stop());};
 const close=modal(keep?'카메라 연속 스캔':'카메라 바코드 스캔',[video,msg],[{t:'닫기'}],()=>stop());
 let lastC='',lastT=0;
 const found=async code=>{if(done)return;const now=Date.now(),same=code===lastC&&now-lastT<1500;lastC=code;lastT=now;if(keep&&same)return;
  if(navigator.vibrate)try{navigator.vibrate(60)}catch{}
  if(keep){const r=cb?await cb(code):'';if(r){msg.style.color='';msg.textContent=r;}return;}
  close();(cb||doLook)(code);};
 const fail=e=>{msg.style.color='var(--r)';msg.textContent=e&&e.name==='NotAllowedError'?'카메라 사용이 거부되었습니다. 브라우저(또는 설정)에서 이 사이트의 카메라를 허용해 주세요.':(e&&e.message)||'카메라를 시작하지 못했습니다.';};
 const FMT=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];
 try{
  if('BarcodeDetector' in window){
   try{
    const sup=await BarcodeDetector.getSupportedFormats();const want=FMT.filter(f=>sup.includes(f));
    if(want.length){
     const det=new BarcodeDetector({formats:want});
     stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
     if(done){stop();return;}
     video.srcObject=stream;await video.play();
     timer=setInterval(async()=>{if(done||video.readyState<2)return;try{const r=await det.detect(video);if(r.length)found(r[0].rawValue);}catch{}},180);
     return;}
   }catch(e){if(e&&e.name==='NotAllowedError')throw e;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
  }
  await loadZX();if(done)return;
  const Z=window.ZXing,hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.QR_CODE]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  reader=new Z.BrowserMultiFormatReader(hints,250);
  await reader.decodeFromVideoDevice(null,video,(res)=>{if(res)found(res.getText());});
 }catch(e){fail(e);}
}

// ---- 가격POP: 바코드를 모아 56×32mm 가격 라벨(정가 줄표시 + 할인가)을 만든다. 서버에는 올리지 않고 이 기기(브라우저)에만 저장 ----
const LW=560,LH=320,PW=2100,PH=2970,COLS=3,ROWS=8;   // 1mm = 10px → 라벨 56×32mm, A4 210×297mm, A4 한 장 3열×8행=24칸

const RND={'1':[1,'r'],'10f':[10,'f'],'100f':[100,'f'],'10r':[10,'r'],'100r':[100,'r']};
function popRound(v,r){if(!(v>0))return 0;const m=RND[r]||RND['10f'];return m[1]==='f'?Math.floor(v/m[0])*m[0]:Math.round(v/m[0])*m[0];}
// 할인가 = 기준 가격(it.calc: 소비자가·판매가1~10·입고가 중 고른 열의 값) 에서 계산. 입고가 기준이면 마진 % 를 더하고, 그 밖의 가격이면 % 만큼 할인
function popSale(it,S){if(it.sale!=null)return it.sale;if(it.manual>0)return it.manual;
 const b=it.calc!=null?it.calc:(S.mode==='margin'?it.cost:it.base);

// 바코드 그리기: EAN-13 / EAN-8 / UPC-A 는 EAN 방식, 그 밖의 글자·숫자는 Code128
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function eanOk(s){const d=s.split('').map(Number),n=d.pop();let sum=0;d.reverse().forEach((x,i)=>{sum+=x*(i%2?1:3);});return (10-sum%10)%10===n;}
function c128(s){let vals,start;
 if(/^\d{4,}$/.test(s)&&s.length%2===0){start=105;vals=[];for(let i=0;i<s.length;i+=2)vals.push(+s.slice(i,i+2));}
 else if(/^[\x20-\x7e]+$/.test(s)){start=104;vals=[...s].map(ch=>ch.charCodeAt(0)-32);}
 else return '';
 let sum=start;vals.forEach((v,i)=>{sum+=v*(i+1);});vals=[start,...vals,sum%103,106];
 let bits='';vals.forEach(v=>{let bar=true;for(const ch of C128[v]){bits+=(bar?'1':'0').repeat(+ch);bar=!bar;}});return bits;}
function barBits(code){
 if(/^\d{13}$/.test(code)&&eanOk(code)){const p=EAN_P[+code[0]];let b='101';for(let i=1;i<=6;i++)b+=(p[i-1]==='L'?EAN_L:EAN_G)[+code[i]];b+='01010';for(let i=7;i<=12;i++)b+=EAN_R[+code[i]];return b+'101';}
 if(/^\d{12}$/.test(code)&&eanOk(code))return barBits('0'+code);
 if(/^\d{8}$/.test(code)&&eanOk(code)){let b='101';for(let i=0;i<4;i++)b+=EAN_L[+code[i]];b+='01010';for(let i=4;i<8;i++)b+=EAN_R[+code[i]];return b+'101';}
 return c128(code);}
function drawBars(ctx,bits,cx,top,hgt,maxW){if(!bits)return;const mw=Math.max(1,Math.floor(maxW/bits.length)),w=mw*bits.length,x0=Math.round(cx-w/2);ctx.fillStyle='#000';
 for(let i=0;i<bits.length;){if(bits[i]==='1'){let j=i;while(j<bits.length&&bits[j]==='1')j++;ctx.fillRect(x0+i*mw,top,(j-i)*mw,hgt);i=j;}else i++;}}

function wrapLines(ctx,text,maxW){const lines=[];let cur='';for(const ch of [...text]){const t=cur+ch;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=ch.trim()===''?'':ch;}else cur=t;}if(cur)lines.push(cur);return lines;}
function fitName(ctx,text,maxW,maxLines,maxPx,minPx){
 for(let px=maxPx;px>=minPx;px-=2){ctx.font='bold '+px+'px '+FONT;const l=wrapLines(ctx,text,maxW);if(l.length<=maxLines)return{px,lines:l};}
 ctx.font='bold '+minPx+'px '+FONT;let l=wrapLines(ctx,text,maxW);if(l.length>maxLines){l=l.slice(0,maxLines);l[maxLines-1]=l[maxLines-1].slice(0,-1)+'…';}return{px:minPx,lines:l};}

// 라벨 1장 그리기 (x,y = 왼쪽 위, 560×320px)
function drawLabel(ctx,x,y,L,guide,badge){
 ctx.save();ctx.translate(x,y);ctx.textBaseline='alphabetic';ctx.textAlign='left';
 if(guide){ctx.strokeStyle='#aaa';ctx.lineWidth=1;ctx.setLineDash([6,6]);ctx.strokeRect(0.5,0.5,LW-1,LH-1);ctx.setLineDash([]);}
 ctx.fillStyle='#000';
 const f=fitName(ctx,L.name||L.code,520,2,34,20);ctx.font='bold '+f.px+'px '+FONT;
 f.lines.forEach((t,i)=>ctx.fillText(t,20,10+f.px*(i+1)+(i?4:0)));
 drawBars(ctx,barBits(L.code),LW/2,90,66,500);
 ctx.font='20px '+FONT;ctx.textAlign='center';ctx.fillText(L.code,LW/2,182);ctx.textAlign='left';
 if(L.sale>0){
  if(L.base>L.sale){
   ctx.font='28px '+FONT;ctx.fillStyle='#444';const t=won(L.base),w=ctx.measureText(t).width;ctx.fillText(t,20,224);
   ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(14,214);ctx.lineTo(26+w,214);ctx.stroke();
   if(badge&&L.pct>0){ctx.fillStyle='#d00000';ctx.fillRect(410,194,130,36);ctx.fillStyle='#fff';ctx.font='bold 24px '+FONT;ctx.textAlign='center';ctx.fillText(L.pct+'% 할인',475,221);ctx.textAlign='left';}
  }
  ctx.fillStyle='#d00000';let px=72;const t2=won(L.sale);for(;px>30;px-=2){ctx.font='bold '+px+'px '+FONT;if(ctx.measureText(t2).width<=520)break;}
  ctx.fillText(t2,20,300);
 }
 ctx.restore();}

  h('div',{class:'card'},h('div',{class:'info',style:'margin-bottom:8px'},'바코드를 스캔해 수량·매입가를 모은 뒤 엑셀 파일로 이 폰에 저장하거나 공유합니다. 서버로 올라가지 않습니다.'),
   field('작업명 (필수 — 파일 이름에 쓰임)',nm),field('상품 시트 (선택하면 상품명·매입가를 자동으로 채움)',sh),cw,
   h('div',{class:'bar'},h('button',{class:'b',onclick:()=>{
    const name=nm.value.trim();if(!name){toast('작업명을 입력하세요.',1);return;}

let cntQ=Promise.resolve();
function cntScan(code,cam){const r=cntQ.then(()=>cntRun(code,cam));cntQ=r.catch(()=>{});return r;}
async function cntRun(code,cam){
 code=(code||'').trim();if(!code)return '';const D=st.cnt&&st.cnt.draft;if(!D)return '';
 dgWarn(code);   // 자리수가 달라도 경고음·알림만 내고 계속 처리
 let cp=parseFloat(($('#cq')||{}).value);if(!(cp>0))cp=1;
 let it=D.items.find(x=>x.code===code),isNew=!it;
 if(!it){it={code,name:'',qty:0,price:0};
  if(D.sheetId){try{const j=await api('/api/sheets/'+D.sheetId+'/lookup?code='+encodeURIComponent(code)),g=k=>k?String(j.data[k]==null?'':j.data[k]).trim():'';
   const nmk=(j.cols.find(c=>/상품명|품명|제품명|품목|이름/.test(String(c.name).replace(/\s/g,'')))||{}).key,bc=g(D.keyKey)||code;it.code=bc;it.name=g(nmk);it.price=popNum(g(D.costKey));
   const ex=D.items.find(x=>x.code===bc);if(ex){it=ex;isNew=false;}}catch{it.nf=1;}}
  if(isNew)D.items.push(it);}
 it.qty+=cp;D.hist=(D.hist||[]).slice(-300);D.hist.push({code:it.code,isNew,cp});D.last={code:it.code};cntPersist();beep(true);render();
 if(!cam){const el=$('#ck');if(el)el.focus();}
 return (it.name||it.code)+' — 수량 '+it.qty;}
function cntUndo(){const D=st.cnt.draft,hs=D.hist||[],a=hs.pop();if(!a){toast('취소할 입력이 없습니다.',1);return;}
 const i=D.items.findIndex(x=>x.code===a.code);let nm=a.code;
 if(i>=0){const it=D.items[i];nm=it.name||it.code;if(a.isNew||it.qty<=a.cp)D.items.splice(i,1);else it.qty-=a.cp;}
 D.hist=hs;D.last=null;cntPersist();render();toast('마지막 입력을 취소했습니다: '+nm);}
const cntWon=n=>Math.round(n*100)/100;
function cntEdit(it){
 const D=st.cnt.draft,q=h('input',{type:'number',value:String(it.qty),min:'0',step:'any',style:'width:120px;font-size:18px'}),p=h('input',{type:'number',value:it.price?String(it.price):'',min:'0',step:'any',placeholder:'0',style:'width:140px;font-size:18px'});
 modal(it.name||it.code,[h('div',{class:'info'},it.code),field('수량',q),field('매입가 (단가)',p)],
  [{t:'이 줄 삭제',c:'r',f:()=>{D.items=D.items.filter(x=>x!==it);cntPersist();render();}},{t:'취소'},
   {t:'저장',c:'b',f:()=>{const n=parseFloat(q.value);if(!(n>=0)){toast('수량을 확인하세요.',1);return false;}it.qty=n;it.price=parseFloat(p.value)||0;cntPersist();render();}}]);}
function cntWork(app){
 const D=st.cnt.draft;
 app.append(h('div',{class:'bar'},h('button',{onclick:()=>{st.cnt=null;render();}},'← 시트로'),h('b',{style:'font-size:17px;color:var(--bd)'},'📋 '+D.name),h('span',{class:'sp'}),
  h('button',{class:'p',onclick:cntExport},'📤 엑셀 내보내기'),h('button',{class:'r',onclick:()=>{if(confirm('이 점검 작업을 지우고 새로 시작할까요? (내보내지 않은 내용은 사라집니다)')){lsSet('zs_cnt_draft',null);st.cnt={};render();}}},'새 작업')));
 const inp=h('input',{id:'ck',placeholder:'바코드 스캔·입력',inputmode:kbOff()?'none':'numeric',autocomplete:'off',style:'flex:1;min-width:180px;font-size:18px',oninput:e=>popAutoSchedule(e.target,cntScan),onkeydown:e=>{if(e.key==='Enter'){clearTimeout(popAutoT);cntScan(e.target.value);}}});
 const q=h('input',{id:'cq',type:'number',value:'1',min:'0',step:'any',style:'width:76px;font-size:18px',title:'한 번 스캔할 때 더할 수량'});
 let last=null;if(D.last&&D.last.err)last=h('div',{style:'margin-top:8px;color:var(--r);font-weight:bold'},'⚠ '+D.last.err);
 else if(D.last){const it=D.items.find(x=>x.code===D.last.code);if(it)last=h('div',{style:'margin-top:8px;border-left:6px solid var(--b);padding:6px 10px;background:var(--bs);border-radius:8px'},
  h('div',{style:'font-size:19px;font-weight:bold;color:var(--bd)'},it.name||it.code),h('div',{style:'font-size:20px;font-weight:bold'},'수량 '+it.qty+(it.price>0?' · 매입가 '+won(it.price):'')),h('div',{class:'info'},it.code+(it.nf?' · 상품 시트에 없음':'')));}
 app.append(h('div',{class:'card',style:'margin-bottom:8px;padding:10px'},h('div',{class:'bar',style:'margin:0'},inp,h('span',{class:'info'},'수량'),q,h('button',{class:'o',onclick:()=>openCam(c=>cntScan(c,true),true)},'📷 카메라 스캔'),kbBtn()),
  h('div',{class:'bar',style:'margin:8px 0 0'},h('button',{onclick:cntUndo},'↩ 마지막 입력 삭제'),h('span',{class:'info'},'스캔하면 바로 추가됩니다')),last));
 const th=h('tr',null,['#','바코드','상품명','수량','매입가','합계'].map(x=>h('th',null,x)));
 const rows=D.items.map((it,i)=>h('tr',{onclick:()=>cntEdit(it)},h('td',{class:'n'},i+1),h('td',null,it.code),h('td',null,it.name||''),h('td',{style:'text-align:right;font-weight:bold'},String(cntWon(it.qty))),
  h('td',{style:'text-align:right'},it.price>0?won(it.price):''),h('td',{style:'text-align:right'},it.price>0?won(it.qty*it.price):'')));
 app.append(h('div',{class:'wrap',style:'max-height:50vh'},h('table',null,h('thead',null,th),h('tbody',null,rows))));
 const tq=D.items.reduce((a,x)=>a+x.qty,0),tm=D.items.reduce((a,x)=>a+x.qty*x.price,0);
 app.append(h('div',{class:'info',style:'margin:6px 0'},D.items.length+'개 바코드 · 총 수량 '+cntWon(tq)+(tm>0?' · 합계 '+won(tm):'')+'. 줄을 누르면 수량·매입가를 고치거나 삭제할 수 있습니다.'));}
function cntExport(){
 const D=st.cnt.draft;if(!D.items.length){toast('스캔한 내용이 없습니다.',1);return;}
 const fn=h('input',{value:safeFn(D.name)+'_'+popToday()+'.xlsx',style:'width:100%'});
 const wn=h('input',{type:'checkbox'}),wt=h('input',{type:'checkbox'});
 const build=()=>{const head=['바코드'];if(wn.checked)head.push('상품명');head.push('수량','매입가');if(wt.checked)head.push('합계');
  const rows=[head,...D.items.map(it=>{const r=[String(it.code)];if(wn.checked)r.push(it.name||'');r.push(it.qty,it.price||0);if(wt.checked)r.push(Math.round(it.qty*it.price*100)/100);return r;})];
  const w=[22];if(wn.checked)w.push(28);w.push(10,12);if(wt.checked)w.push(14);
  let name=fn.value.trim()||'수량점검.xlsx';if(!/\.xlsx$/i.test(name))name+='.xlsx';return {blob:xlsxBuild(rows,w,'수량점검'),name};};
 modal('엑셀로 내보내기',[h('div',{class:'info'},D.items.length+'개 바코드 · 열: 바코드, 수량, 매입가'),field('파일 이름',fn),
  h('label',{style:'display:block;margin:6px 0'},wn,' 상품명 열도 넣기'),h('label',{style:'display:block;margin:6px 0'},wt,' 합계(수량×매입가) 열도 넣기'),
  h('div',{class:'info'},'[내 파일로 저장]은 폰의 다운로드(내 파일) 폴더에 저장됩니다. [공유]는 카카오톡·메일·드라이브 등으로 바로 보냅니다.')],
  [{t:'닫기'},{t:'공유',c:'g',keep:true,f:async()=>{const {blob,name}=build();await shareFiles([new File([blob],name,{type:blob.type})],name);return false;}},
   {t:'내 파일로 저장',c:'b',keep:true,f:()=>{const {blob,name}=build();dlBlob(blob,name);toast('저장했습니다: '+name);return false;}}]);}
